stages:
  - generate

generate-appset:
  stage: generate

  image: python:3.11-slim

  before_script:
    - apt-get update
    - apt-get install curl git bash jq -y
    - pip install -r requirements.txt

  script:
    - python script.py ##> applicationset.yaml
    - git config user.email "ci@gitlab"
    - git config user.name "gitlab-ci"
    - git remote set-url origin "https://oauth2:${GITLAB_PAT}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git add applicationset.yaml
    - git diff --cached --quiet && echo "No changes" && exit 0
    - git commit -m "update applicationset"
    - git pull --rebase origin $CI_COMMIT_REF_NAME
    - git push origin HEAD:$CI_COMMIT_REF_NAME

  artifacts:
    paths:
      - applicationset.yaml
    expire_in: 1 hour

